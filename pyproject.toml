[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-robomem"
version = "0.1.2"
description = "Engram: the open cross-modal memory layer for physical AI. Index a robot's video, audio, and motion; search and reason about it in plain language. Import as `robomem`."
authors = [{ name = "Abdul Basit Tonmoy" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["robotics", "embeddings", "multimodal", "memory", "retrieval", "imu", "physical-ai"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]
dependencies = [
    "lancedb>=0.6",
    "pyarrow>=14",
    "numpy>=1.24",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/Eximius-Labs/engram"
Repository = "https://github.com/Eximius-Labs/engram"

[project.optional-dependencies]
# The real embedder. The whole ingest -> index -> recall path runs GPU-free against an
# injected fake, so the base install and tests never need it. The [hf] extra pulls the
# loading deps; the weights download from Hugging Face at runtime.
model = ["fusion-embedding[hf]"]
# Video frame decoding for the real embed_video path.
video = ["av>=12"]
# Robot-log ingestion (later phase). Declared now so the extra names are stable.
ros = ["mcap>=1.1", "rosbags>=0.9", "pyulog>=1.0"]

[dependency-groups]
dev = ["pytest>=7"]

[project.scripts]
robomem = "robomem.cli:main"

[tool.setuptools.packages.find]
include = ["robomem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
