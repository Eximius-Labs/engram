[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-robomem"
version = "0.1.0"
description = "Engram: the open cross-modal memory layer for physical AI. Index a robot's video, audio, and motion; search and reason about it in plain language. Import as `robomem`."
authors = [{ name = "Abdul Basit Tonmoy" }]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["robotics", "embeddings", "multimodal", "memory", "retrieval", "imu", "physical-ai"]
dependencies = [
    "lancedb>=0.6",
    "pyarrow>=14",
    "numpy>=1.24",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/Eximius-Labs/engram"
Repository = "https://github.com/Eximius-Labs/engram"

[project.optional-dependencies]
# The real embedder (fusion_embedding) is not on PyPI yet; install it from source:
#   pip install "fusion_embedding @ git+https://github.com/Eximius-Labs/fusion-embedding"
# The whole ingest -> index -> recall path runs GPU-free against an injected fake, so the
# base install and tests never need it.
model = []
# Video frame decoding for the real embed_video path.
video = ["av>=12"]
# Robot-log ingestion (later phase). Declared now so the extra names are stable.
ros = ["mcap>=1.1", "rosbags>=0.9", "pyulog>=1.0"]

[dependency-groups]
dev = ["pytest>=7"]

[project.scripts]
robomem = "robomem.cli:main"

[tool.setuptools.packages.find]
include = ["robomem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
